<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Ultra-Futurista ELOHIM AI</title>

  <!-- Fuentes Pro & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- JSZip para descargar grupos de fotos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --bg-dark: #030712;
      --card-bg: rgba(15, 23, 42, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-bg: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(255, 255, 255, 0.15);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Canvas de fondo con partículas y aurora */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      pointer-events: none;
    }

    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
      height: 90vh;
      background: radial-gradient(circle, var(--primary-glow) 0%, var(--accent-glow) 40%, transparent 70%);
      z-index: -1;
      pointer-events: none;
      filter: blur(100px);
      transition: all 1s ease;
      opacity: 0.6;
    }

    /* Encabezado */
    header {
      padding: 2.5rem 1.5rem 1rem;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      box-shadow: 0 0 30px var(--primary-glow);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 50%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      letter-spacing: -1px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Toolbar Flotante Pro */
    .toolbar-wrapper {
      position: sticky;
      top: 20px;
      z-index: 100;
      max-width: 1300px;
      margin: 1.5rem auto 2.5rem;
      padding: 0 1rem;
    }

    .toolbar {
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 0.8rem 1.4rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .folder-input-wrapper {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 4px 8px 4px 14px;
      gap: 8px;
      transition: border 0.3s ease;
    }

    .folder-input-wrapper:focus-within {
      border-color: var(--primary);
    }

    .folder-input-wrapper input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      width: 120px;
      font-weight: 600;
    }

    .btn-icon {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-icon:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(56, 189, 248, 0.2);
    }

    .btn-icon.active {
      background: var(--primary);
      color: #030712;
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .btn-primary-action {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #030712;
      font-weight: 700;
      border: none;
      padding: 10px 20px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 5px 20px var(--primary-glow);
      transition: all 0.3s ease;
    }

    .btn-primary-action:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    /* AVATAR INTERACTIVO 3D AVANZADO */
    .avatar-widget {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    .avatar-speech {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
      padding: 14px 20px;
      border-radius: 20px 20px 4px 20px;
      font-size: 0.9rem;
      max-width: 280px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      display: none;
      animation: fadeIn 0.3s ease;
      line-height: 1.4;
    }

    .avatar-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0f172a, #030712);
      border: 2px solid var(--primary);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 30px var(--primary-glow);
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .avatar-btn:hover {
      transform: scale(1.1) rotate(5deg);
      border-color: var(--accent);
      box-shadow: 0 0 35px var(--accent-glow);
    }

    /* Traje y Modelo Dinámico del Avatar */
    .avatar-core {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary) 0%, var(--accent) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2.5s infinite alternate;
      transition: all 0.5s ease;
    }

    .avatar-model-cyberpunk {
      background: radial-gradient(circle, #f43f5e 0%, #a855f7 100%) !important;
    }

    .avatar-model-gold {
      background: radial-gradient(circle, #eab308 0%, #f97316 100%) !important;
    }

    /* Galería y Modos de Presentación */
    .gallery-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    /* Modo 1: Grid Grid Moderno */
    .layout-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.8rem;
    }

    /* Modo 2: Mosaico Creativo (Masonry Style) */
    .layout-masonry {
      display: columns;
      column-width: 300px;
      column-gap: 1.8rem;
    }
    .layout-masonry .gallery-card {
      margin-bottom: 1.8rem;
      break-inside: avoid;
      aspect-ratio: auto;
    }

    /* Modo 3: Carrusel 3D / Stream */
    .layout-carousel {
      display: flex;
      overflow-x: auto;
      gap: 2rem;
      padding: 2rem 1rem;
      scroll-snap-type: x mandatory;
    }
    .layout-carousel .gallery-card {
      min-width: 320px;
      scroll-snap-align: center;
    }

    /* Estilo de Tarjetas con Vidrio y Luces */
    .gallery-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 4 / 3;
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .gallery-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: var(--primary);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--primary-glow);
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .gallery-card:hover img {
      transform: scale(1.08);
    }

    /* Checkbox de Selección Múltiple */
    .select-checkbox {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 28px;
      height: 28px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.4);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .gallery-card.selected .select-checkbox {
      background: var(--primary);
      border-color: var(--primary);
      color: #030712;
    }

    /* Capa flotante con acciones directas */
    .card-actions {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.2rem;
      background: linear-gradient(to top, rgba(3, 7, 18, 0.9) 0%, transparent 100%);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      display: flex;
      justify-content: flex-end;
    }

    .gallery-card:hover .card-actions {
      opacity: 1;
      transform: translateY(0);
    }

    .btn-quick-download {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-quick-download:hover {
      background: var(--primary);
      color: #030712;
      border-color: var(--primary);
      transform: scale(1.15);
    }

    /* Modal Visor Pro */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(3, 7, 18, 0.95);
      backdrop-filter: blur(30px);
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-viewport {
      position: relative;
      max-width: 90vw;
      max-height: 82vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-img {
      max-width: 90vw;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.9);
      transition: transform 0.2s ease;
    }

    .modal-controls {
      position: absolute;
      top: 25px;
      right: 25px;
      display: flex;
      gap: 12px;
      z-index: 1010;
    }

    .modal-bottom-bar {
      position: absolute;
      bottom: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 10px 24px;
      border-radius: 40px;
      z-index: 1010;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--card-border);
      color: #fff;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1005;
      transition: all 0.2s ease;
    }

    .nav-arrow:hover {
      background: var(--primary);
      color: #030712;
      transform: translateY(-50%) scale(1.1);
    }

    .nav-prev { left: 25px; }
    .nav-next { right: 25px; }

    /* Animaciones Generales */
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6); }
      100% { box-shadow: 0 0 0 20px rgba(56, 189, 248, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status-container {
      text-align: center;
      padding: 5rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 3px solid rgba(56, 189, 248, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Fondo interactivo con Canvas -->
  <canvas id="bgCanvas"></canvas>
  <div class="ambient-glow" id="ambientGlow"></div>

  <!-- Encabezado -->
  <header>
    <div class="brand-pill">
      <i data-lucide="sparkles" style="width: 16px; height: 16px;"></i>
      Centro Galería ELOHIM AI
    </div>
    <h1>Galería de Fotos Ultra-Futurista</h1>
  </header>

  <!-- Toolbar Flotante Pro -->
  <div class="toolbar-wrapper">
    <div class="toolbar">
      <!-- Selector de Carpeta -->
      <div class="tool-group">
        <div class="folder-input-wrapper">
          <i data-lucide="folder" style="width: 18px; height: 18px; color: var(--primary);"></i>
          <input type="text" id="folderInput" value="29092026">
          <button class="btn-icon" onclick="cargarGaleria()" title="Cargar carpeta">
            <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i>
          </button>
        </div>
      </div>

      <!-- Cambiador de Diseños de Presentación -->
      <div class="tool-group">
        <button class="btn-icon active" id="btnLayoutGrid" onclick="cambiarLayout('grid')" title="Vista Grid">
          <i data-lucide="grid" style="width: 16px; height: 16px;"></i>
        </button>
        <button class="btn-icon" id="btnLayoutMasonry" onclick="cambiarLayout('masonry')" title="Vista Mosaico">
          <i data-lucide="layout-grid" style="width: 16px; height: 16px;"></i>
        </button>
        <button class="btn-icon" id="btnLayoutCarousel" onclick="cambiarLayout('carousel')" title="Vista Carrusel Stream">
          <i data-lucide="layers" style="width: 16px; height: 16px;"></i>
        </button>
      </div>

      <!-- Fondos Ambientales -->
      <div class="tool-group">
        <button class="btn-icon" onclick="cambiarFondo('cosmic')" title="Fondo Cósmico">
          <i data-lucide="moon" style="width: 16px; height: 16px;"></i>
        </button>
        <button class="btn-icon" onclick="cambiarFondo('neon')" title="Fondo Neón Cyberpunk">
          <i data-lucide="zap" style="width: 16px; height: 16px;"></i>
        </button>
        <button class="btn-icon" onclick="cambiarFondo('sunset')" title="Fondo Sunset Gold">
          <i data-lucide="sun" style="width: 16px; height: 16px;"></i>
        </button>
      </div>

      <!-- Descarga Masiva ZIP -->
      <div class="tool-group">
        <button class="btn-primary-action" id="downloadSelectedBtn" onclick="descargarSeleccionadasZip()" style="display: none;">
          <i data-lucide="download-cloud" style="width: 18px; height: 18px;"></i>
          ZIP (<span id="selectedCount">0</span>)
        </button>
      </div>
    </div>
  </div>

  <!-- Galería Principal -->
  <main class="gallery-container">
    <div class="layout-grid" id="galleryContainer">
      <div class="status-container">
        <div class="spinner"></div>
        <p>Cargando fotografías desde GitHub...</p>
      </div>
    </div>
  </main>

  <!-- Modal Lightbox Pro -->
  <div class="modal" id="imageModal">
    <div class="modal-controls">
      <button class="btn-icon" onclick="rotarImagen()" title="Rotar Imagen">
        <i data-lucide="rotate-cw"></i>
      </button>
      <button class="btn-icon" onclick="descargarImagenActual()" title="Descargar foto">
        <i data-lucide="download"></i>
      </button>
      <button class="btn-icon" onclick="cerrarModal()" title="Cerrar (Esc)">
        <i data-lucide="x"></i>
      </button>
    </div>

    <button class="nav-arrow nav-prev" onclick="cambiarFotoModal(-1)">
      <i data-lucide="chevron-left"></i>
    </button>
    
    <div class="modal-viewport">
      <img src="" alt="Foto" class="modal-img" id="modalImg">
    </div>

    <button class="nav-arrow nav-next" onclick="cambiarFotoModal(1)">
      <i data-lucide="chevron-right"></i>
    </button>

    <div class="modal-bottom-bar">
      <span id="modalIndexText" style="font-size: 0.9rem; font-weight: 600;">1 de 10</span>
    </div>
  </div>

  <!-- Avatar Interactivo con Modelos Cambiantes -->
  <div class="avatar-widget">
    <div class="avatar-speech" id="avatarSpeech">
      ¡Hola! Soy ELOHIM AI. ¡Haz clic en mí para cambiar mi modelo de avatar o cambiar el estilo de presentación de las fotos!
    </div>
    <div class="avatar-btn" onclick="interactuarAvatar()">
      <div class="avatar-core" id="avatarCore">
        <i data-lucide="bot" style="color: #030712; width: 26px; height: 26px;"></i>
      </div>
    </div>
  </div>

  <script>
    // Configuración general
    const config = {
      usuario: 'DesarrolloInfantilTemprano-DIT',
      repositorio: 'ELOHIM',
      carpeta: '29092026'
    };

    let listaFotos = [];
    let seleccionados = new Set();
    let indexFotoActual = 0;
    let anguloRotacion = 0;
    let avatarModeloIdx = 0;
    let layoutActual = 'grid';

    // Inicialización al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initParticles();
      cargarGaleria();
    });

    // 1. Carga de fotos desde la API de GitHub
    async function cargarGaleria() {
      const folderName = document.getElementById('folderInput').value.trim() || config.carpeta;
      config.carpeta = folderName;

      const container = document.getElementById('galleryContainer');
      container.innerHTML = `
        <div class="status-container">
          <div class="spinner"></div>
          <p>Conectando con la carpeta '${folderName}'...</p>
        </div>
      `;

      seleccionados.clear();
      actualizarBotonDescarga();

      const apiUrl = `https://api.github.com/repos/${config.usuario}/${config.repositorio}/contents/${folderName}`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('No se encontró la carpeta especificada');
        
        const files = await response.json();
        const exts = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
        
        listaFotos = files.filter(f => exts.some(ext => f.name.toLowerCase().endsWith(ext)));

        if (listaFotos.length === 0) {
          container.innerHTML = `
            <div class="status-container">
              <i data-lucide="image-off" style="width: 48px; height: 48px; margin-bottom: 1rem; color: #64748b;"></i>
              <p>No se encontraron fotografías en la carpeta <strong>'${folderName}'</strong>.</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        renderizarGaleria();
        hablarAvatar(`¡Listo! Se han cargado ${listaFotos.length} fotografías exitosamente.`);

      } catch (err) {
        container.innerHTML = `
          <div class="status-container">
            <i data-lucide="alert-circle" style="width: 48px; height: 48px; margin-bottom: 1rem; color: #ef4444;"></i>
            <p>Error al conectar. Verifica que la carpeta <strong>'${folderName}'</strong> exista en GitHub.</p>
          </div>
        `;
        lucide.createIcons();
      }
    }

    // 2. Renderizado flexible según el diseño
    function renderizarGaleria() {
      const container = document.getElementById('galleryContainer');
      container.innerHTML = '';

      listaFotos.forEach((foto, idx) => {
        const card = document.createElement('div');
        card.className = `gallery-card ${seleccionados.has(idx) ? 'selected' : ''}`;
        
        card.innerHTML = `
          <div class="select-checkbox" onclick="toggleSeleccion(event, ${idx})">
            <i data-lucide="check" style="width: 16px; height: 16px; display: ${seleccionados.has(idx) ? 'block' : 'none'}"></i>
          </div>
          <img src="${foto.download_url}" alt="Fotografía" loading="lazy">
          <div class="card-actions">
            <button class="btn-quick-download" onclick="descargarFotoDirecta(event, '${foto.download_url}')" title="Descargar foto">
              <i data-lucide="download" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        `;

        card.addEventListener('click', (e) => {
          if (!e.target.closest('.select-checkbox') && !e.target.closest('.card-actions')) {
            abrirModal(idx);
          }
        });

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // 3. Modos de Presentación de Layouts
    function cambiarLayout(modo) {
      layoutActual = modo;
      const container = document.getElementById('galleryContainer');
      
      document.querySelectorAll('#btnLayoutGrid, #btnLayoutMasonry, #btnLayoutCarousel').forEach(b => b.classList.remove('active'));
      
      if (modo === 'grid') {
        container.className = 'layout-grid';
        document.getElementById('btnLayoutGrid').classList.add('active');
        hablarAvatar('Cambiado a vista de Cuadrícula Clásica.');
      } else if (modo === 'masonry') {
        container.className = 'layout-masonry';
        document.getElementById('btnLayoutMasonry').classList.add('active');
        hablarAvatar('Cambiado a vista de Mosaico Creativo.');
      } else if (modo === 'carousel') {
        container.className = 'layout-carousel';
        document.getElementById('btnLayoutCarousel').classList.add('active');
        hablarAvatar('Cambiado a vista Carrusel Stream en desplazamiento horizontal.');
      }
    }

    // 4. Gestión de Selección Múltiple
    function toggleSeleccion(event, idx) {
      event.stopPropagation();
      if (seleccionados.has(idx)) {
        seleccionados.delete(idx);
      } else {
        seleccionados.add(idx);
      }
      actualizarBotonDescarga();
      renderizarGaleria();
    }

    function actualizarBotonDescarga() {
      const btn = document.getElementById('downloadSelectedBtn');
      const countSpan = document.getElementById('selectedCount');
      countSpan.innerText = seleccionados.size;

      if (seleccionados.size > 0) {
        btn.style.display = 'inline-flex';
      } else {
        btn.style.display = 'none';
      }
    }

    // 5. Descarga en paquete ZIP
    async function descargarSeleccionadasZip() {
      if (seleccionados.size === 0) return;

      hablarAvatar('Comprimiendo fotos en un paquete ZIP...');
      const zip = new JSZip();
      const folder = zip.folder("Fotos_ELOHIM");

      for (let idx of seleccionados) {
        const foto = listaFotos[idx];
        try {
          const resp = await fetch(foto.download_url);
          const blob = await resp.blob();
          folder.file(foto.name, blob);
        } catch (e) {
          console.error("Error al añadir foto al ZIP:", e);
        }
      }

      zip.generateAsync({ type: "blob" }).then((content) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = `Galeria_${config.carpeta}_ELOHIM.zip`;
        a.click();
        hablarAvatar('¡Descarga completada con éxito!');
      });
    }

    // 6. Descarga Individual de Imagen
    async function descargarFotoDirecta(event, url) {
      if (event) event.stopPropagation();
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Fotografia_ELOHIM.jpg';
        a.click();
      } catch (err) {
        window.open(url, '_blank');
      }
    }

    // 7. Visor Lightbox Pro
    function abrirModal(idx) {
      indexFotoActual = idx;
      anguloRotacion = 0;
      const modal = document.getElementById('imageModal');
      const img = document.getElementById('modalImg');
      
      img.style.transform = `rotate(0deg)`;
      img.src = listaFotos[indexFotoActual].download_url;
      
      document.getElementById('modalIndexText').innerText = `${indexFotoActual + 1} de ${listaFotos.length}`;
      modal.classList.add('active');
    }

    function cerrarModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    function cambiarFotoModal(direccion) {
      indexFotoActual = (indexFotoActual + direccion + listaFotos.length) % listaFotos.length;
      abrirModal(indexFotoActual);
    }

    function rotarImagen() {
      anguloRotacion = (anguloRotacion + 90) % 360;
      document.getElementById('modalImg').style.transform = `rotate(${anguloRotacion}deg)`;
    }

    function descargarImagenActual() {
      descargarFotoDirecta(null, listaFotos[indexFotoActual].download_url);
    }

    // Accesos directos de teclado
    document.addEventListener('keydown', (e) => {
      const modal = document.getElementById('imageModal');
      if (!modal.classList.contains('active')) return;
      if (e.key === 'Escape') cerrarModal();
      if (e.key === 'ArrowLeft') cambiarFotoModal(-1);
      if (e.key === 'ArrowRight') cambiarFotoModal(1);
    });

    // 8. Cambiador de Fondos Neón Dinámicos
    function cambiarFondo(tema) {
      const glow = document.getElementById('ambientGlow');
      if (tema === 'cosmic') {
        glow.style.background = 'radial-gradient(circle, rgba(56, 189, 248, 0.3) 0%, rgba(168, 85, 247, 0.2) 50%, transparent 70%)';
        hablarAvatar('Fondo Cósmico activado.');
      } else if (tema === 'neon') {
        glow.style.background = 'radial-gradient(circle, rgba(244, 63, 94, 0.35) 0%, rgba(168, 85, 247, 0.25) 50%, transparent 70%)';
        hablarAvatar('Fondo Neón Cyberpunk activado.');
      } else if (tema === 'sunset') {
        glow.style.background = 'radial-gradient(circle, rgba(249, 115, 22, 0.35) 0%, rgba(234, 179, 8, 0.2) 50%, transparent 70%)';
        hablarAvatar('Fondo Sunset Gold activado.');
      }
    }

    // 9. Motor de Partículas Interactivas en Canvas
    function initParticles() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 60 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 2 + 0.5,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        alpha: Math.random() * 0.6 + 0.2
      }));

      function animate() {
        ctx.clearRect(0, 0, width, height);

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
          ctx.fill();
        });

        requestAnimationFrame(animate);
      }

      animate();
    }

    // 10. Avatar IA Interactivo con Trajes/Modelos Cambiantes
    function hablarAvatar(mensaje) {
      const speech = document.getElementById('avatarSpeech');
      speech.innerText = mensaje;
      speech.style.display = 'block';
      setTimeout(() => {
        speech.style.display = 'none';
      }, 4000);
    }

    function interactuarAvatar() {
      avatarModeloIdx = (avatarModeloIdx + 1) % 3;
      const avatarCore = document.getElementById('avatarCore');

      if (avatarModeloIdx === 0) {
        avatarCore.className = 'avatar-core';
        hablarAvatar("Modelo Clásico IA cargado. ¡Usa la barra superior para cambiar el diseño de presentación!");
      } else if (avatarModeloIdx === 1) {
        avatarCore.className = 'avatar-core avatar-model-cyberpunk';
        hablarAvatar("¡Modelo Cyberpunk activado! Puedes seleccionar varias imágenes y bajarlas todas juntas en un ZIP.");
      } else if (avatarModeloIdx === 2) {
        avatarCore.className = 'avatar-core avatar-model-gold';
        hablarAvatar("¡Modelo Gold Elite listo! Usa las flechas de tu teclado para moverte entre fotos dentro del visor.");
      }
    }
  </script>
