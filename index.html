<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELOHIM</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    /* Grid de Galería */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      aspect-ratio: 4 / 3;
    }

    .gallery-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.25);
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Mensaje de carga o sin fotos */
    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: #94a3b8;
      font-size: 1.1rem;
    }

    /* Modal / Lightbox */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-content {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 2.5rem;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Galería de Fotos</h1>
    <p>Carga automática desde GitHub</p>
  </header>

  <!-- Contenedor donde se cargan las fotos dinámicamente -->
  <main class="gallery-grid" id="galleryContainer">
    <div class="status-msg">Cargando imágenes...</div>
  </main>

  <!-- Modal para ver la foto a pantalla completa -->
  <div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close-btn">&times;</span>
    <img class="modal-content" id="modalImg">
  </div>

  <footer>
    <p>&copy; Alojado en GitHub Pages</p>
  </footer>

  <script>
    // =========================================================
    // CONFIGURACIÓN:
    // =========================================================
    const usuarioGitHub = 'DesarrolloInfantilTemprano-DIT';
    const repositorio   = 'ELOHIM';
    const carpetaImg    = '29092026';

    const container = document.getElementById('galleryContainer');
    const apiUrl = `https://api.github.com/repos/${usuarioGitHub}/${repositorio}/contents/${carpetaImg}`;

    // Obtener las fotos desde la API de GitHub
    fetch(apiUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error('No se pudo acceder a la carpeta de imágenes.');
        }
        return response.json();
      })
      .then(files => {
        container.innerHTML = ''; // Limpiar mensaje de carga

        // Extensiones válidas de imagen
        const extensiones = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
        
        const fotos = files.filter(file => 
          extensiones.some(ext => file.name.toLowerCase().endsWith(ext))
        );

        if (fotos.length === 0) {
          container.innerHTML = '<div class="status-msg">No hay imágenes en la carpeta img/</div>';
          return;
        }

        // Crear tarjeta por cada imagen encontrada
        fotos.forEach(foto => {
          const card = document.createElement('div');
          card.className = 'gallery-card';
          card.onclick = () => openModal(foto.download_url);

          const img = document.createElement('img');
          img.src = foto.download_url;
          img.alt = foto.name;
          img.loading = 'lazy';

          card.appendChild(img);
          container.appendChild(card);
        });
      })
      .catch(error => {
        console.error('Error:', error);
        container.innerHTML = '<div class="status-msg">Error al cargar las fotos. Revisa los nombres de tu usuario y repositorio.</div>';
      });

    // Funciones del visor modal (lightbox)
    function openModal(imageSrc) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modal.style.display = 'flex';
      modalImg.src = imageSrc;
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>

</body>
</html>
