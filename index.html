<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Fotos</title>

  <!-- Fuentes Pro & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- JSZip para descargar grupos de fotos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --rose: #f43f5e;
      --bg-dark: #070913;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --glass-bg: rgba(15, 23, 42, 0.65);
      --glass-border: rgba(255, 255, 255, 0.18);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo de Aurora Suave & Canvas */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      pointer-events: none;
    }

    .aurora-container {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.75;
      filter: blur(80px);
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      animation: floatAurora 18s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
    }

    .blob-1 {
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.35), transparent 70%);
    }

    .blob-2 {
      bottom: -15%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.35), transparent 70%);
      animation-delay: -5s;
    }

    .blob-3 {
      top: 40%;
      left: 30%;
      width: 45vw;
      height: 45vw;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.25), transparent 70%);
      animation-delay: -10s;
    }

    @keyframes floatAurora {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(80px, 60px) scale(1.15) rotate(120deg); }
      100% { transform: translate(-60px, 100px) scale(0.9) rotate(240deg); }
    }

    /* Encabezado Principal */
    header {
      padding: 2.5rem 1.5rem 1rem;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 22px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 2.5px;
      margin-bottom: 1rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(16px);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 40%, #a855f7 80%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      letter-spacing: -1.5px;
      text-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    /* Toolbar Flotante Ultra Pro */
    .toolbar-wrapper {
      position: sticky;
      top: 20px;
      z-index: 100;
      max-width: 1380px;
      margin: 1.5rem auto 2.5rem;
      padding: 0 1rem;
    }

    .toolbar {
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 0.8rem 1.6rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .folder-input-wrapper {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 4px 8px 4px 14px;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .folder-input-wrapper:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .folder-input-wrapper input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      width: 110px;
      font-weight: 600;
    }

    .btn-icon {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-icon:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 20px var(--primary-glow);
    }

    .btn-icon.active {
      background: linear-gradient(135deg, var(--primary), #0284c7);
      color: #030712;
      border-color: var(--primary);
      box-shadow: 0 0 25px var(--primary-glow);
    }

    .btn-remix {
      background: linear-gradient(135deg, #f43f5e 0%, #a855f7 100%) !important;
      color: #ffffff !important;
      border: none !important;
      font-weight: 700;
      box-shadow: 0 5px 20px rgba(244, 63, 94, 0.4);
    }

    .btn-remix:hover {
      transform: translateY(-3px) rotate(3deg) scale(1.05) !important;
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.5) !important;
    }

    .btn-primary-action {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #030712;
      font-weight: 700;
      border: none;
      padding: 10px 22px;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 25px var(--primary-glow);
      transition: all 0.3s ease;
    }

    .btn-primary-action:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 30px var(--accent-glow);
    }

    /* AVATAR INTERACTIVO */
    .avatar-widget {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    .avatar-speech {
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--primary);
      padding: 14px 22px;
      border-radius: 24px 24px 4px 24px;
      font-size: 0.9rem;
      max-width: 300px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: none;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      line-height: 1.4;
    }

    .avatar-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid var(--primary);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 35px var(--primary-glow);
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .avatar-btn:hover {
      transform: scale(1.12) rotate(8deg);
      border-color: var(--accent);
      box-shadow: 0 0 45px var(--accent-glow);
    }

    .avatar-core {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary) 0%, var(--accent) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2.5s infinite alternate;
      transition: all 0.5s ease;
    }

    .avatar-model-cyberpunk { background: radial-gradient(circle, #f43f5e 0%, #a855f7 100%) !important; }
    .avatar-model-gold { background: radial-gradient(circle, #eab308 0%, #f97316 100%) !important; }
    .avatar-model-emerald { background: radial-gradient(circle, #10b981 0%, #06b6d4 100%) !important; }

    /* Galería y Layouts */
    .gallery-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1.5rem 5rem;
      min-height: 60vh;
    }

    /* Modo 1: Grid */
    .layout-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.8rem;
    }

    /* Modo 2: Mosaico Masonry */
    .layout-masonry {
      column-width: 290px;
      column-gap: 1.8rem;
    }
    .layout-masonry .gallery-card {
      margin-bottom: 1.8rem;
      break-inside: avoid;
      aspect-ratio: auto;
    }

    /* Modo 3: Coverflow 3D Ultramoderno */
    .layout-coverflow {
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      padding: 4rem 0;
      overflow-x: auto;
      gap: -50px;
    }

    .layout-coverflow .gallery-card {
      min-width: 320px;
      height: 440px;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      transform-style: preserve-3d;
      margin: 0 -40px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }

    .layout-coverflow .gallery-card:hover {
      transform: translateZ(120px) rotateY(0deg) scale(1.1) !important;
      z-index: 100 !important;
    }

    /* Tarjetas de Galería */
    .gallery-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 4 / 3;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gallery-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: var(--primary);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px var(--primary-glow);
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease;
    }

    .gallery-card:hover img {
      transform: scale(1.08);
    }

    /* Checkbox de Selección */
    .select-checkbox {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.4);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .gallery-card.selected .select-checkbox {
      background: var(--primary);
      border-color: var(--primary);
      color: #030712;
    }

    .card-actions {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.2rem;
      background: linear-gradient(to top, rgba(3, 7, 18, 0.9) 0%, transparent 100%);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      display: flex;
      justify-content: flex-end;
    }

    .gallery-card:hover .card-actions {
      opacity: 1;
      transform: translateY(0);
    }

    .btn-quick-download {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-quick-download:hover {
      background: var(--primary);
      color: #030712;
      transform: scale(1.15);
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(3, 7, 18, 0.96);
      backdrop-filter: blur(35px);
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-viewport {
      position: relative;
      max-width: 90vw;
      max-height: 82vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-img {
      max-width: 90vw;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.95);
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .modal-controls {
      position: absolute;
      top: 25px;
      right: 25px;
      display: flex;
      gap: 12px;
      z-index: 1010;
    }

    .modal-bottom-bar {
      position: absolute;
      bottom: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      padding: 10px 26px;
      border-radius: 40px;
      z-index: 1010;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--card-border);
      color: #fff;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1005;
      transition: all 0.2s ease;
    }

    .nav-arrow:hover {
      background: var(--primary);
      color: #030712;
      transform: translateY(-50%) scale(1.12);
    }

    .nav-prev { left: 25px; }
    .nav-next { right: 25px; }

    /* Filtros FX */
    .filter-cyber { filter: hue-rotate(90deg) contrast(1.2); }
    .filter-bw { filter: grayscale(100%) contrast(1.3); }
    .filter-warm { filter: sepia(40%) saturate(140%); }

    /* Animaciones */
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6); }
      100% { box-shadow: 0 0 0 22px rgba(56, 189, 248, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status-container {
      text-align: center;
      padding: 6rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Aurora Fluid Background & Interactive Canvas -->
  <div class="aurora-container">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
  </div>
  <canvas id="bgCanvas"></canvas>

  <!-- Encabezado -->
  <header>
    <div class="brand-pill">
      <i data-lucide="sparkles" style="width: 16px; height: 16px;"></i>
      Galería de fotos
    </div>
    <h1>Atención de Salud Infantil</h1>
  </header>

  <!-- Toolbar Flotante Pro -->
  <div class="toolbar-wrapper">
    <div class="toolbar">
      <!-- Selector de Carpeta -->
      <div class="tool-group">
        <div class="folder-input-wrapper">
          <i data-lucide="folder" style="width: 18px; height: 18px; color: var(--primary);"></i>
          <input type="text" id="folderInput" value="29092026">
          <button class="btn-icon" onclick="cargarGaleria()" title="Cargar fotos">
            <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i>
          </button>
        </div>
      </div>

      <!-- Modos de Diseño Exclusivos -->
      <div class="tool-group">
        <button class="btn-icon active" id="btnLayoutGrid" onclick="cambiarLayout('grid')" title="Cuadrícula">
          <i data-lucide="grid" style="width: 16px; height: 16px;"></i>
        </button>
        <button class="btn-icon" id="btnLayoutMasonry" onclick="cambiarLayout('masonry')" title="Mosaico">
          <i data-lucide="layout-grid" style="width: 16px; height: 16px;"></i>
        </button>
        <button class="btn-icon" id="btnLayoutCoverflow" onclick="cambiarLayout('coverflow')" title="3D Coverflow Super Moderno">
          <i data-lucide="disc" style="width: 16px; height: 16px;"></i>
        </button>
      </div>

      <!-- Super Función: Mezclador / Chaos Remix -->
      <div class="tool-group">
        <button class="btn-icon btn-remix" onclick="mezclarFotosChaos()" title="Mezclar y Desordenar Fotos">
          <i data-lucide="shuffle" style="width: 16px; height: 16px;"></i>
          Mezclar / Remix
        </button>
      </div>

      <!-- Filtros FX -->
      <div class="tool-group">
        <button class="btn-icon" onclick="aplicarFiltroEfecto('normal')" title="Color Normal">
          <i data-lucide="sun" style="width: 16px; height: 16px;"></i>
        </button>
        <button class="btn-icon" onclick="aplicarFiltroEfecto('cyber')" title="Modo Cyberpunk">
          <i data-lucide="zap" style="width: 16px; height: 16px;"></i>
        </button>
        <button class="btn-icon" onclick="aplicarFiltroEfecto('bw')" title="Blanco y Negro Pro">
          <i data-lucide="moon" style="width: 16px; height: 16px;"></i>
        </button>
      </div>

      <!-- Descarga Paquete ZIP -->
      <div class="tool-group">
        <button class="btn-primary-action" id="downloadSelectedBtn" onclick="descargarSeleccionadasZip()" style="display: none;">
          <i data-lucide="download-cloud" style="width: 18px; height: 18px;"></i>
          ZIP (<span id="selectedCount">0</span>)
        </button>
      </div>
    </div>
  </div>

  <!-- Galería Principal -->
  <main class="gallery-container">
    <div class="layout-grid" id="galleryContainer">
      <div class="status-container">
        <div class="spinner"></div>
        <p>Cargando fotografías desde el repositorio de GitHub...</p>
      </div>
    </div>
  </main>

  <!-- Modal Visor Lightbox Pro -->
  <div class="modal" id="imageModal">
    <div class="modal-controls">
      <button class="btn-icon" onclick="rotarImagen()" title="Rotar Imagen">
        <i data-lucide="rotate-cw"></i>
      </button>
      <button class="btn-icon" onclick="descargarImagenActual()" title="Descargar foto">
        <i data-lucide="download"></i>
      </button>
      <button class="btn-icon" onclick="cerrarModal()" title="Cerrar (Esc)">
        <i data-lucide="x"></i>
      </button>
    </div>

    <button class="nav-arrow nav-prev" onclick="cambiarFotoModal(-1)">
      <i data-lucide="chevron-left"></i>
    </button>
    
    <div class="modal-viewport">
      <img src="" alt="Fotografía" class="modal-img" id="modalImg">
    </div>

    <button class="nav-arrow nav-next" onclick="cambiarFotoModal(1)">
      <i data-lucide="chevron-right"></i>
    </button>

    <div class="modal-bottom-bar">
      <span id="modalIndexText" style="font-size: 0.9rem; font-weight: 600;">1 de 10</span>
    </div>
  </div>

  <!-- Avatar Interactivo con Modelos Múltiples -->
  <div class="avatar-widget">
    <div class="avatar-speech" id="avatarSpeech">
      ¡Bienvenido! Haz clic en "Mezclar / Remix" para desordenar aleatoriamente las fotos o prueba el modo "3D Coverflow".
    </div>
    <div class="avatar-btn" onclick="interactuarAvatar()">
      <div class="avatar-core" id="avatarCore">
        <i data-lucide="bot" style="color: #030712; width: 28px; height: 28px;"></i>
      </div>
    </div>
  </div>

  <script>
    const config = {
      usuario: 'DesarrolloInfantilTemprano-DIT',
      repositorio: 'ELOHIM',
      carpeta: '29092026'
    };

    let listaFotos = [];
    let seleccionados = new Set();
    let indexFotoActual = 0;
    let anguloRotacion = 0;
    let avatarModeloIdx = 0;
    let layoutActual = 'grid';
    let filtroEfectoActual = 'normal';

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initParticles();
      cargarGaleria();
    });

    // 1. Obtener fotos desde GitHub
    async function cargarGaleria() {
      const folderName = document.getElementById('folderInput').value.trim() || config.carpeta;
      config.carpeta = folderName;

      const container = document.getElementById('galleryContainer');
      container.innerHTML = `
        <div class="status-container">
          <div class="spinner"></div>
          <p>Conectando con la carpeta '${folderName}'...</p>
        </div>
      `;

      seleccionados.clear();
      actualizarBotonDescarga();

      const apiUrl = `https://api.github.com/repos/${config.usuario}/${config.repositorio}/contents/${folderName}`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Error al conectar con la carpeta');
        
        const files = await response.json();
        const exts = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
        
        listaFotos = files.filter(f => exts.some(ext => f.name.toLowerCase().endsWith(ext)));

        if (listaFotos.length === 0) {
          container.innerHTML = `
            <div class="status-container">
              <i data-lucide="image-off" style="width: 48px; height: 48px; margin-bottom: 1rem; color: #64748b;"></i>
              <p>No se encontraron fotografías en la carpeta <strong>'${folderName}'</strong>.</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        renderizarGaleria();
        hablarAvatar(`¡Increíble! He cargado ${listaFotos.length} fotos listas para explorar.`);

      } catch (err) {
        container.innerHTML = `
          <div class="status-container">
            <i data-lucide="alert-circle" style="width: 48px; height: 48px; margin-bottom: 1rem; color: #ef4444;"></i>
            <p>Error al conectar. Verifica que la carpeta <strong>'${folderName}'</strong> exista en GitHub.</p>
          </div>
        `;
        lucide.createIcons();
      }
    }

    // 2. Renderizado dinámico según el modo seleccionado
    function renderizarGaleria() {
      const container = document.getElementById('galleryContainer');
      container.innerHTML = '';

      listaFotos.forEach((foto, idx) => {
        const card = document.createElement('div');
        card.className = `gallery-card ${seleccionados.has(idx) ? 'selected' : ''}`;
        
        // Efecto visual Coverflow 3D si está activo
        if (layoutActual === 'coverflow') {
          const offset = idx - Math.floor(listaFotos.length / 2);
          const rotY = offset * -12;
          card.style.transform = `rotateY(${rotY}deg) translateZ(${Math.abs(offset) * -30}px)`;
        } else {
          card.style.transform = '';
        }

        card.innerHTML = `
          <div class="select-checkbox" onclick="toggleSeleccion(event, ${idx})">
            <i data-lucide="check" style="width: 16px; height: 16px; display: ${seleccionados.has(idx) ? 'block' : 'none'}"></i>
          </div>
          <img src="${foto.download_url}" class="${getClaseFiltro()}" alt="Fotografía" loading="lazy">
          <div class="card-actions">
            <button class="btn-quick-download" onclick="descargarFotoDirecta(event, '${foto.download_url}')" title="Descargar foto">
              <i data-lucide="download" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        `;

        card.addEventListener('click', (e) => {
          if (!e.target.closest('.select-checkbox') && !e.target.closest('.card-actions')) {
            reproducirSonidoUI(600);
            abrirModal(idx);
          }
        });

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // 3. Super Función: Mezclador / Chaos Remix
    function mezclarFotosChaos() {
      reproducirSonidoUI(800);
      
      // Algoritmo Fisher-Yates para desordenar
      for (let i = listaFotos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [listaFotos[i], listaFotos[j]] = [listaFotos[j], listaFotos[i]];
      }

      seleccionados.clear();
      actualizarBotonDescarga();
      renderizarGaleria();
      hablarAvatar("¡Boom! Fotos desordenadas y reprogramadas en un orden completamente aleatorio.");
    }

    // 4. Diseños y Layouts
    function cambiarLayout(modo) {
      reproducirSonidoUI(500);
      layoutActual = modo;
      const container = document.getElementById('galleryContainer');
      
      document.querySelectorAll('#btnLayoutGrid, #btnLayoutMasonry, #btnLayoutCoverflow').forEach(b => b.classList.remove('active'));
      
      if (modo === 'grid') {
        container.className = 'layout-grid';
        document.getElementById('btnLayoutGrid').classList.add('active');
        hablarAvatar('Vista en Cuadrícula limpia y estructurada.');
      } else if (modo === 'masonry') {
        container.className = 'layout-masonry';
        document.getElementById('btnLayoutMasonry').classList.add('active');
        hablarAvatar('Vista Mosaico Creativo activada.');
      } else if (modo === 'coverflow') {
        container.className = 'layout-coverflow';
        document.getElementById('btnLayoutCoverflow').classList.add('active');
        hablarAvatar('Modo 3D Coverflow Ultra Moderno activado. ¡Pasa el cursor sobre las fotos!');
      }

      renderizarGaleria();
    }

    // 5. Filtros FX
    function aplicarFiltroEfecto(efecto) {
      reproducirSonidoUI(700);
      filtroEfectoActual = efecto;
      renderizarGaleria();
      hablarAvatar(`Filtro visual cambiado a modo ${efecto.toUpperCase()}.`);
    }

    function getClaseFiltro() {
      if (filtroEfectoActual === 'cyber') return 'filter-cyber';
      if (filtroEfectoActual === 'bw') return 'filter-bw';
      if (filtroEfectoActual === 'warm') return 'filter-warm';
      return '';
    }

    // 6. Selección Múltiple y ZIP
    function toggleSeleccion(event, idx) {
      event.stopPropagation();
      reproducirSonidoUI(400);
      if (seleccionados.has(idx)) {
        seleccionados.delete(idx);
      } else {
        seleccionados.add(idx);
      }
      actualizarBotonDescarga();
      renderizarGaleria();
    }

    function actualizarBotonDescarga() {
      const btn = document.getElementById('downloadSelectedBtn');
      const countSpan = document.getElementById('selectedCount');
      countSpan.innerText = seleccionados.size;

      if (seleccionados.size > 0) {
        btn.style.display = 'inline-flex';
      } else {
        btn.style.display = 'none';
      }
    }

    async function descargarSeleccionadasZip() {
      if (seleccionados.size === 0) return;

      hablarAvatar('Comprimiendo selección en un paquete ZIP...');
      const zip = new JSZip();
      const folder = zip.folder("ELOHIM_Fotos");

      for (let idx of seleccionados) {
        const foto = listaFotos[idx];
        try {
          const resp = await fetch(foto.download_url);
          const blob = await resp.blob();
          folder.file(foto.name, blob);
        } catch (e) {
          console.error("Error comprimiendo foto:", e);
        }
      }

      zip.generateAsync({ type: "blob" }).then((content) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = `Galeria_${config.carpeta}_ELOHIM.zip`;
        a.click();
        hablarAvatar('¡Descarga masiva de fotos completada exitosamente!');
      });
    }

    // 7. Descarga individual
    async function descargarFotoDirecta(event, url) {
      if (event) event.stopPropagation();
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'ELOHIM_Foto.jpg';
        a.click();
      } catch (err) {
        window.open(url, '_blank');
      }
    }

    // 8. Visor Lightbox Pro
    function abrirModal(idx) {
      indexFotoActual = idx;
      anguloRotacion = 0;
      const modal = document.getElementById('imageModal');
      const img = document.getElementById('modalImg');
      
      img.style.transform = `rotate(0deg)`;
      img.className = `modal-img ${getClaseFiltro()}`;
      img.src = listaFotos[indexFotoActual].download_url;
      
      document.getElementById('modalIndexText').innerText = `${indexFotoActual + 1} de ${listaFotos.length}`;
      modal.classList.add('active');
    }

    function cerrarModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    function cambiarFotoModal(direccion) {
      reproducirSonidoUI(450);
      indexFotoActual = (indexFotoActual + direccion + listaFotos.length) % listaFotos.length;
      abrirModal(indexFotoActual);
    }

    function rotarImagen() {
      reproducirSonidoUI(550);
      anguloRotacion = (anguloRotacion + 90) % 360;
      document.getElementById('modalImg').style.transform = `rotate(${anguloRotacion}deg)`;
    }

    function descargarImagenActual() {
      descargarFotoDirecta(null, listaFotos[indexFotoActual].download_url);
    }

    // Teclas directas
    document.addEventListener('keydown', (e) => {
      const modal = document.getElementById('imageModal');
      if (!modal.classList.contains('active')) return;
      if (e.key === 'Escape') cerrarModal();
      if (e.key === 'ArrowLeft') cambiarFotoModal(-1);
      if (e.key === 'ArrowRight') cambiarFotoModal(1);
    });

    // 9. Canvas de Partículas Fluidas
    function initParticles() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 45 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 2.5 + 0.5,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        alpha: Math.random() * 0.5 + 0.2
      }));

      function animate() {
        ctx.clearRect(0, 0, width, height);

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
          ctx.fill();
        });

        requestAnimationFrame(animate);
      }

      animate();
    }

    // 10. Avatar Interactivo
    function hablarAvatar(mensaje) {
      const speech = document.getElementById('avatarSpeech');
      speech.innerText = mensaje;
      speech.style.display = 'block';
      setTimeout(() => {
        speech.style.display = 'none';
      }, 4200);
    }

    function interactuarAvatar() {
      reproducirSonidoUI(900);
      avatarModeloIdx = (avatarModeloIdx + 1) % 4;
      const avatarCore = document.getElementById('avatarCore');

      if (avatarModeloIdx === 0) {
        avatarCore.className = 'avatar-core';
        hablarAvatar("Modelo Clásico listo. ¿Has probado mezclar las fotos?");
      } else if (avatarModeloIdx === 1) {
        avatarCore.className = 'avatar-core avatar-model-cyberpunk';
        hablarAvatar("¡Traje Neon Cyberpunk activado! Filtros de color disponibles en la barra flotante.");
      } else if (avatarModeloIdx === 2) {
        avatarCore.className = 'avatar-core avatar-model-gold';
        hablarAvatar("¡Modo Gold VIP! Selecciona varias fotos haciendo clic en el check superior de cada tarjeta.");
      } else if (avatarModeloIdx === 3) {
        avatarCore.className = 'avatar-core avatar-model-emerald';
        hablarAvatar("¡Traje Esmeralda Neón! Usa las flechas del teclado para navegar en pantalla completa.");
      }
    }

    // 11. Efectos de Sonido UI Sintetizados (Sin archivos externos)
    function reproducirSonidoUI(freq) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {
        // Fallback en caso de bloqueo de audio del navegador
      }
    }
  </script>
